[pytest]
minversion = 8.0
pythonpath = .
testpaths = tests
addopts = -v --strict-markers
markers =
    unit: быстрые тесты без внешних зависимостей
    integration: требуют поднятых контейнеров (docker compose up -d)
    gpu: требуют GPU, в CI пропускаются
    load: нагрузочные сценарии (запускаются через locust)
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
